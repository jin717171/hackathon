/* v6 — focused welcome, separate personal sign-in, then team selection */
.hero-v6{min-height:452px;grid-template-columns:1.05fr .95fr}
.hero-v6 .hero-copy{position:relative;z-index:1}
.hero-kicker{font-size:13px;font-weight:900;letter-spacing:.05em;color:#93ece6;margin-bottom:21px}
.hero-v6 h1{font-size:clamp(36px,5vw,64px);margin-bottom:18px}
.hero-v6 p{font-size:16px;max-width:485px;margin-bottom:27px}
.hero-cta{display:flex;flex-wrap:wrap;gap:11px}
.hero-cta .btn{min-width:158px;padding:14px 22px;min-height:52px;justify-content:space-between;font-size:15px}
.hero-cta .hero-primary{background:#fff;color:#3c35aa}
.hero-cta .hero-outline{color:white;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.55)}
.hero-cta .hero-outline:hover{background:rgba(255,255,255,.19)}
.mock-heading{font-size:19px;margin:15px 0 13px}
.mock-complete{color:#168b76;font-weight:900}
.mock-progress{height:8px;background:#eeeaff;border-radius:8px;margin-top:15px}
.mock-progress i{display:block;width:77%;height:100%;border-radius:8px;background:#6c5ae9}
.infographic-section{margin:49px 0 15px}
.infographic-title{text-align:center;margin:0 auto 25px;max-width:720px}
.infographic-title h2{font-size:clamp(26px,3vw,33px);margin-bottom:9px}
.infographic-title p{font-size:15px;color:var(--muted)}
.hack-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.hack-step{position:relative;border:1px solid #e7e6f5;background:#fff;border-radius:22px;padding:24px 18px 25px;text-align:center;box-shadow:var(--shadow);min-width:0}
.hack-step:not(:last-child):after{content:'›';position:absolute;z-index:2;right:-18px;top:39%;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #dedcf7;font-size:30px;line-height:1;color:#7669dc;box-shadow:0 3px 10px rgba(56,41,156,.12)}
.hack-symbol{width:83px;height:83px;border-radius:24px;display:grid;place-items:center;margin:0 auto 18px;font-size:39px}
.symbol-one{background:#fff2d9}.symbol-two{background:#eae5ff}.symbol-three{background:#e1f4ff}.symbol-four{background:#d9f8ef}
.hack-count{font-size:12px;font-weight:900;letter-spacing:.14em;color:#6756d5;margin-bottom:8px}
.hack-step h3{font-size:19px;margin-bottom:9px}
.hack-step p{color:#63708b;font-size:13px;line-height:1.65}
.hack-bottom{display:flex;align-items:center;justify-content:center;gap:15px;margin-top:23px;color:#5a5ca7;font-size:13px;font-weight:850}
.hack-bottom .hack-arrow{color:#a3a2bf}
.auth-page{max-width:830px;margin:44px auto 0}
.auth-heading{text-align:center;margin:0 auto 25px}

공부법 검색\n4) 예상 결과물: 공부법 등록, 메타인지 태깅 효능 리뷰 작성 및 맞춤 추천 기능이 구현된 웹\n5) 기대효과: 나에게 맞는 공부법 발견, 공부법 정보의 신뢰성 극대화, 동료 학습 활성화", "feedback": "[좋은 점] 대상 사용자의 어려움과 후기·학습 성향 태그·필터라는 핵심 기능이 명확합니다. 학생 간 경험 공유와 메타인지 연결도 좋습니다.\n[주의할 점] 다른 학생을 공격하는 후기·신상 공개·중복 계정·허위 리뷰를 방지할 필요가 있습니다. ‘실제로 검증된 공부법’이라는 단정은 단순 좋아요·후기만으로 보장할 수 없습니다. 실명 확인을 앱만으로 자동 수행하기는 어렵습니다.\n[이번 해커톤 권장 범위] ① 공부법 게시글(제목·방법·성향 태그) ② 태그 검색 ③ 체험 후기와 자기평가 ④ 신고 버튼·운영자 삭제 기능을 만드세요. 게시글은 익명 표시 가능하지만 관리자에게 작성자 기록이 남는 구조를 기획하세요. 계정 유일성은 학교가 승인한 인증 방식으로 구현해야 합니다.\n[팀에 묻기] 누가 게시글을 지울 수 있나요? 비방 댓글과 중복 후기를 어떻게 처리하나요? 개인정보를 최소화할 수 있나요?"}, "8": {"members": "김량현, 이지안, 장동하", "plan": "1. 해결하고 싶은 문제\n1)문제 상황: 최근 친환경 제품에 대한 관심이 높아지면서 제품을 친환경적으로 보이게 홍보하는 사례가 문제됨(그린워싱 문제)\n2)누가 겪는 문제인가? 친환경 제품을 구매하는 소비자, 친환경 소재를 개발하는 연구자, 제품을 생산하고 판매하는 기업 등이 문제를 겪을 수 있음\n3) 왜 해결이 필요한가? 그린워싱은 소비자가 정확한 정보에 근거해 제품을 선택하는 것을 어렵게하고 실제 환경적 효과가 충분히 확인되지 않은 제품의 구매로 이어질 수 있다. 따라서 제품의 광고문구와 과학적 근거를 비교할 수 있는 도구를 마련해 소비자가 판단하도록 도울 필요가 있다.\n4) 한줄로 문제쓰기: 친환경 제품 광고의 주장과 과학적 근거를 쉽게 비교하기 어려워 발생하는 소비자의 정보 부족 문제를 해결해야 한다.\n\n2. 해결 아이디어\n1) 해결 아이디어: 제품의 친환경 광고 문구와 소재 정보, 분해 조건, 환경 인증 및 관련 근거 자료를 분석하는 화학 데이터 기반 그린워싱 팩트체크 프로그램을 개발한다\n2) 어떻게 해결할까? 친환경 제품의 광고 문구, 소재, 분해조건, 환경인증 등 다양한 관련 정보를 수집한다. 공공기관과 공신력있는 자료에서 확인한 정보를 출처와 데이터베이스에 저장한다. 사용자가 제품의 광고 문구과 소재 정보를 입력할 수 있는 화면을 만든다. 조건문과 비교 알고리즘을 활용해 입력된 주장에 관한 근거가 있는지 확인하고 필요 항목을 분류한다. 분석 결과와 근거 자료의 출처를 화면에 표시해 사용자가 직접 확인할 수 있게 한다.\n3) 필요한 기능 또는 방법: 용자가 제품의 광고 문구과 소재 정보를 입력할 수 있는 화면, 공공기관과 공신력있는 자료에서 확인한 정보를 출처를 비교하는 기능, 주장에 관한 근거가 있는지 확인하고 필요 항목을 분류, 자료의 출처를 화면에 표시해 사용자가 직접 확인하는 기능\n4) 예상 결과물: 사용자가 친환경 제품의 광고 문구와 소재 정보를 입력하면 관련 근거 자료와 비교 결과를 보여주는 프로그램을 제작한다.\n5) 기대효과: 소비자가 친환경 광고를 비판적으로 검토하고 과학적 근거를 바탕으로 합리적인 구매 결정을 내리는데 도움을 줄 수 있다. 또한 환경적 효과를 검토하며 화학적 능력을 기르고 소비자의 구매 선택과 기업의 신뢰를 경제적으로 이해할 수 있다.", "feedback": "[좋은 점] 친환경 광고 주장과 객관적 근거를 비교한다는 목표가 뚜렷하고, 정보의 출처를 직접 보여 주려는 설계가 좋습니다.\n[구현 한계] 모든 제품 광고의 진실을 자동 판정하려면 검증된 최신 근거 자료와 분석 체계가 필요합니다. ‘그린워싱 확정’과 같은 판정은 근거 부족 시 피해야 합니다. 외부 기관 사이트의 데이터를 무단 수집하면 이용 조건 문제가 생길 수 있습니다.\n[이번 해커톤 권장 범위] ① 제품 SEED[10]={"members":"교사","plan":"1. 해결하고 싶은 문제\n1) 문제 상황: 생성형 인공지능을 활용하면 프로그래밍 경험이 부족한 사람도 웹앱을 제작할 수 있지만, 처음 접하는 사용자는 자신의 아이디어를 구체화하거나 인공지능에 정확한 요구사항을 전달하는 데 어려움을 겪는다. 특히 기능 설계, 화면 구성, 프롬프트 작성 및 웹앱 배포 과정을 체계적으로 안내하는 도구가 필요하다.\n2) 누가 겪는 문제인가? 바이브 코딩을 처음 접하는 학생과 일반인, 인공지능 활용 경험이 부족하거나 프로그래밍에 익숙하지 않은 사용자.\n3) 왜 해결이 필요한가? 바이브 코딩을 쉽게 익힐 수 있다면 전문적인 프로그래밍 지식이 부족하더라도 자신의 아이디어를 디지털 결과물로 구현할 수 있다. 따라서 사용자가 기획부터 제작과 배포까지 단계적으로 경험할 수 있는 환경을 제공하여 인공지능 활용 역량과 창의적인 문제 해결 능력을 높이고자 한다.\n4) 한 줄로 문제쓰기: 바이브 코딩 초보자가 자신의 아이디어를 구체적인 웹앱으로 구현하는 과정에서 겪는 기획·제작·배포의 어려움을 해결하고자 한다.\n\n2. 해결 아이디어\n1) 해결 아이디어: 사용자가 단계별 질문에 답하며 웹앱의 목적, 기능, 디자인, 이용 흐름을 설계하고, 작성한 내용을 바탕으로 완성도 높은 AI 제작 프롬프트를 자동 생성하는 웹앱 제작 지원 플랫폼을 개발한다.\n2) 어떻게 해결할까? 웹앱 기획 과정을 작은 단계로 나누어 구체적인 질문과 작성 예시를 제공한다. 사용자의 답변을 분석하기 쉬운 형식으로 정리하여 제작 프롬프트를 생성하고, 이를 ChatGPT에 활용하도록 안내한다. 이후 Supabase와 GitHub를 이용한 데이터 저장 및 웹사이트 배포 과정도 단계별 안내 자료로 제공한다.\n3) 필요한 기능 또는 방법: 단계별 웹앱 기획 질문 및 답변 저장, 사용자·기능·화면·모바일 디자인 상세 설계, 디자인 참고 이미지 미리보기, 제작 프롬프트 자동 생성·복사·다운로드, ChatGPT 활용 안내, Supabase 및 GitHub 연동·배포 가이드, 반응형 인터페이스.\n4) 예상 결과물: 웹앱 제작 경험이 없는 사용자도 자신의 아이디어를 체계적으로 기획하고, AI 제작 프롬프트를 생성하여 웹앱 제작과 배포 과정을 경험할 수 있는 모바일 친화형 웹 플랫폼.\n5) 기대효과: 인공지능과 프로그래밍에 익숙하지 않은 사용자의 기술적 진입 장벽을 낮추고, 아이디어를 실제 프로그램으로 구현하는 경험을 제공한다. 이를 통해 자기주도적 학습과 창의적인 문제 해결 능력을 기르고, 다양한 분야에서 인공지능을 효과적으로 활용할 수 있도록 돕는다.","feedback":"[교사 예시] 바이브온(VibeON): 아이디어를 켜다, 나만의 웹앱을 만들다.\n[제작 목표] 단계별 질문에 답하면서 자신의 웹앱을 기획하고, ChatGPT에 넣을 프롬프트와 Supabase·GitHub 제작·배포 과정을 안내하는 웹앱을 설계합니다.\n[실현 가능 범위] 기획·프롬프트 생성·참고 이미지 미리보기·배포 안내를 우선 구현하고, 외부 서비스 자동 가입/배포와 실제 AI 코드 생성은 구현 범위에서 제외합니다.\n[참고 안내] 25문항이 모두 기입된 설계 예시입니다. 웹앱 체험 버튼은 실제 URL 또는 HTML을 등록한 후에만 나타납니다."};

const TEACHER_VIBEON_SPEC={"name":"바이브온(VibeON) — 아이디어를 켜다, 나만의 웹앱을 만들다. 브라우저 제목은 「바이브온 | 나의 첫 웹앱」으로 표시한다.","audience":"중·고등학생과 바이브 코딩 입문자(약 14세 이상), 프로그래밍이나 AI 프롬프트 작성이 익숙하지 않은 사용자. 학교 컴퓨터실에서는 PC로 기획하고, 집이나 이동 중에는 휴대폰으로 이어서 작성한다. 전문 용어는 쉬운 설명과 예시를 함께 제공한다.","goal":"「기획 시작하기」를 눌러 제작하고 싶은 웹앱의 주제와 대상 사용자를 정하고, 바로 첫 기획 문항에 답할 수 있어야 한다. 이전에 쓰던 기록이 있으면 「이어하기」로 즉시 복귀한다.","scope":"단계별 기획 설문, 답변 자동 저장, 진행률, 참고 이미지 미리보기, 완성 프롬프트 생성·복사·TXT 다운로드, ChatGPT·Supabase·GitHub의 단계별 안내를 구현한다. 실제 AI 코드 생성, Supabase 프로젝트 자동 생성, GitHub 로그인·배포 자동 실행은 이번 버전에서 제외하고 안내만 제공한다.","features":"① 상세 기획: 사용자가 5개 분야의 질문에 답변 → 입력값 검증·진행률 계산·자동 저장 → 다음 단계와 작성 현황 표시.\n② AI 프롬프트: 필수 문항을 모두 답변하고 「프롬프트 만들기」 클릭 → 문제·대상·화면·버튼 동작·디자인·모바일·검증 기준을 하나의 지시문으로 구성 → 미리보기·전체 복사·TXT 저장.\n③ 제작·배포 따라하기: ChatGPT/Supabase/GitHub 단계 선택 → 해당 단계의 설명·캡처 자리·체크리스트 표시 → 사용자가 완료 항목을 체크하고 다음 단계로 이동.","input":"앱 이름, 해결할 문제, 대상 사용자·기기, 핵심 기능 3개, 각 기능의 입력·처리·출력, 필요한 입력칸·버튼·선택지, 데이터 저장 항목, 화면별 구성·이동 흐름, 오류 처리, 색·스타일·모바일 배치, 테스트 기준. textarea·라디오·체크박스·단계 이동·참고 이미지 파일 선택(최대 3장)·저장·복사·초기화 버튼을 제공한다.","logic":"각 문항에 required 속성(필수 여부)을 부여하고, 공백을 제거한 답변이 있으면 완료로 계산한다. 진행률 = 작성된 필수 문항 수 ÷ 전체 필수 문항 수 × 100. 미완료 문항은 목록과 해당 문항으로 이동 버튼을 보여준다. 필수 항목이 모두 채워지면 프롬프트 복사를 활성화한다. 생성된 프롬프트는 5개 분야별로 답변을 끼워 넣고 마지막에 모바일·테스트·저장 기준을 붙인다. 예시 문구는 사용자 답변으로 자동 제출하지 않는다.","result":"기획 화면: 5단계 표시·현재 단계·완료율·작성된 답변. 프롬프트 화면: 읽기 전용 전체 본문·문자 수·「복사」/「TXT 저장」/「기획 수정」 버튼과 복사 성공 알림. 제작·배포 화면: ChatGPT→Supabase→GitHub 순서의 안내 카드, 캡처 이미지 자리, 단계별 체크리스트와 진행 상태. 참고 이미지는 축소 썸네일과 제거 버튼으로 표시한다.","example":"예시 1: 「방송실 물품 관리」 — 장비 검색, 대여·반납 상태 기록, 위치 확인. 예시 2: 「분리배출 퀴즈」 — 분리배출 방법 선택, 정답 피드백, 가상 포인트. 예시 3: 「공부 계획 도우미」 — 과목·시간 입력, 일정 카드 생성, 완료 체크. 모든 예시는 실제 서비스나 검증된 효과를 의미하지 않는 체험용 데이터이다.","save":"모든 기획 답변, 완료 체크 상태, 선택한 예시, 디자인 설정을 브라우저 localStorage에 저장한다. 입력이 바뀌면 자동 저장하고 새로고침 후 복원한다. 「처음부터 다시」는 확인창을 띄운 뒤 해당 앱 저장 데이터만 지운다. 참고 이미지는 용량을 제한하고 축소 미리보기만 저장하거나, 저장하지 못할 경우 다시 첨부해야 한다고 명확히 안내한다.","exclude":"이 웹앱 자체에서 AI API로 코드를 자동 생성하는 기능, 외부 서비스 계정 자동 가입, Supabase 프로젝트 및 GitHub 저장소 자동 생성, 다중 사용자 실시간 협업, 결제·유료 서비스, 검증되지 않은 실력 평가·성공률 예측, 실제 개인정보 수집은 제외한다.","screens":"① 홈: VibeON 로고, 「처음 만드는 웹앱, 생각부터 배포까지」 제목, 한 줄 소개, 「기획 시작하기」와 「이어하기」 버튼, 3단계 안내 카드.\n② 기획: 상단 5단계 진행표·완료율, 현재 분야 제목·쉬운 설명, 질문 카드·입력칸·작성 예시, 이전/다음 버튼, 이미지 첨부 영역.\n③ 프롬프트: 완성 상태, 미완료 질문 안내, 생성 프롬프트 본문, 전체 복사·TXT 저장·수정 버튼.\n④ 제작·배포 안내: ChatGPT, Supabase, GitHub 탭과 단계별 가이드·캡처 자리·체크리스트·완료 상태.\n⑤ 도움말: 용어 풀이, 자주 묻는 질문, 데이터 저장 안내.","journey":"홈 → 기획 시작 → 앱 방향 결정 → 기능과 동작 정하기 → 화면 흐름 작성 → 참고 이미지와 모바일 디자인 설정 → 테스트 조건 확정 → 프롬프트 확인 → 전체 복사 → ChatGPT에 붙여넣고 참고 이미지 첨부 → HTML 실행·확인 → Supabase·GitHub 안내 따라하기. 재방문 시 홈 → 이어하기 → 마지막 작성 단계.","buttons":"기획 시작하기: 빈 기획 또는 저장된 기획으로 진입. 이어하기: 마지막 단계 복귀. 이전/다음: 답변 유지 후 단계 전환. 프롬프트 만들기: 누락 질문 검사 후 본문 생성. 누락 문항으로 이동: 해당 질문으로 스크롤·포커스. 전체 복사: 클립보드 복사 후 성공/실패 메시지. TXT 저장: UTF-8 .txt 생성. 이미지 추가/삭제: 참고 이미지 미리보기 관리. 가이드 단계: 해당 설명 표시. 처음부터 다시: 확인 후 해당 기획만 초기화.","errors":"필수 질문 누락 시 「필수 질문 2개가 남았어요」와 질문별 이동 버튼 제공, 빈 값으로 생성·복사하지 않음. 복사 실패 시 텍스트 직접 선택·TXT 저장 안내. 이미지 형식/용량 오류는 이유와 허용 조건을 표시. 새 기획·저장 기록 없음·이미지 없음 등의 빈 상태에 다음 행동을 제시한다. 비동기 작업이 있으면 로딩과 중복 클릭 방지를 제공한다.","mood":"첨부한 「웹페이지 스타일.png」를 참고한 프리미엄 미니멀 에디토리얼 디자인. 옅은 라벤더 배경 위에 따뜻한 아이보리 카드, 여백이 풍부한 상품 소개 페이지 같은 정돈된 레이아웃, 얇은 선 아이콘, 간결한 제목과 큰 시각적 구획을 사용한다. 참고 이미지의 쇼핑 콘텐츠와 문구는 복제하지 않는다.","colors":"페이지 배경 #D4CBDF(라벤더), 주요 카드 #F7F5F3(오프화이트), 본문 #29262D(차콜), 보조 텍스트 #68636F, 주요 버튼 #6E5D91(차분한 보라), 라인 #E6E1E9, 완료 표시 #47745B(세이지). 대비가 부족하면 더 어두운 색으로 조정한다.","layout":"상단 얇은 로고 VibeON + 메뉴 아이콘 → 큰 제목 「생각을 웹앱으로.」 → 짧은 설명 2줄 → 크게 보이는 「기획 시작하기」 버튼 → 「이어하기」 보조 버튼 → 3단계(기획·프롬프트·제작/배포) 카드 → 체험 예시 카드. 화려한 장식보다 시작 버튼이 첫 스크롤 안에 보이는 것을 우선한다.","detail":"카드 모서리 18~22px, 내부 여백 20~28px, 요소 간격 12~24px, 구획 사이 40~64px, 최소한의 부드러운 그림자, 1px 회색 테두리. 제목은 우아한 세리프 느낌(한글은 읽기 좋은 시스템 글꼴로 자연스럽게 대체), 본문 16~17px/줄높이 1.6, 얇은 선 아이콘, 버튼은 높이 최소 48px. 이모지를 장식 목적으로 남발하지 않는다.","mobile":"모바일 퍼스트. 좌우 16px 여백, 카드·입력칸 단일 열 100%, 제목은 clamp로 줄바꿈 가능, 본문 16px 이상, 버튼 48px 이상·터치 영역 최소 44×44px, 상단 메뉴는 햄버거 또는 가로 스크롤 단계 탭. 긴 질문과 프롬프트는 컨테이너 안에서 줄바꿈하고 가로 스크롤이 생기지 않게 한다. 키보드가 올라와도 입력창과 저장 버튼 접근이 가능해야 한다.","responsive":"태블릿은 최대 너비 760px 내외의 1~2열 카드, PC는 최대 1160px 중앙 정렬·소개 2열·예시 카드 3열을 사용한다. 기획 본문은 PC에서 좌측 단계 목록과 우측 질문 영역 2열, 휴대폰은 세로 1열로 바뀐다. 모든 기기에서 같은 기능과 데이터가 유지되고 가로 넘침은 없어야 한다.","realistic":"ChatGPT 코드 생성, Supabase 연결, GitHub 배포는 사용자가 각 서비스에서 수행할 작업이므로 이 웹앱에서 자동 실행한다고 표현하지 않는다. 현재 버전은 기획·프롬프트 생성과 따라하기 안내가 실제 동작하며, 배포 안내의 캡처 자리는 추후 교사가 제공할 실제 캡처가 들어갈 구조로 만든다. 연동되지 않은 기능은 더미 성공 화면 대신 단계 안내와 링크를 보여준다.","privacy":"실명, 연락처, 비밀번호, API 비밀키를 입력하거나 수집하지 않는다. 로컬 저장임을 명확히 고지하고 공용 컴퓨터 사용 후에는 데이터 삭제를 안내한다. 사용자가 첨부한 참고 이미지의 저작권을 존중하고 실제 사이트의 제품 사진·문구를 복제하지 않는다. Supabase의 비밀키는 클라이언트 코드에 넣지 않으며 각 서비스 공식 안내 페이지를 연결한다.","tests":"① 390px 휴대폰에서 시작→5단계 입력→프롬프트 미리보기·복사까지 수행하고 가로 넘침·잘림 없는지 확인. ② 필수 질문을 비운 채 생성 시 누락 문항·이동 버튼이 정확히 나오는지 확인한 다음 답변 입력 후 생성 성공 확인. ③ 답변 저장 후 새로고침해도 그대로 남는지, TXT가 정상 다운로드되는지, 초기화는 확인 후 해당 기록만 지우는지 확인.","finish":"단계별 기획·저장·진행률, 필수 누락 검사, 프롬프트 생성·복사·TXT 다운로드, 참고 이미지 미리보기, ChatGPT/Supabase/GitHub 안내가 실제 클릭하며 동작하고, 360/390/768/1280px 화면에서도 가독성과 버튼 조작에 문제가 없으며, 시연 중 가짜 작동 버튼·오류가 없을 때 완성이다."};
const TEACHER_VIBEON_WORK={title:'바이브온(VibeON)',url:'',summary:'바이브 코딩 입문자가 질문에 답하며 자신의 웹앱을 기획하고, ChatGPT 초안 프롬프트와 데이터베이스 연결·최종 배포 순서를 익히도록 돕는 제작 지원 웹앱입니다. 현재는 기획·설계 예시이며 실제 체험 링크는 등록 전입니다.',features:'① 25문항 단계별 웹앱 기획 ② 프롬프트 생성·복사·TXT 저장 ③ 참고 이미지 및 ChatGPT·Supabase·GitHub 따라하기 안내',changes:'교사 예시의 설계 기록을 먼저 공개합니다. 실제 완성·배포 후 링크를 등록하고 작동 결과를 검증할 예정입니다.',updated:'교사 예시 · 기획 준비'};

if((db.version||0)<3){
 const t=db.teamData[10];t.spec ||= {};
 for(const [k,v] of Object.entries(TEACHER_VIBEON_SPEC))if(!nice(t.spec[k]))t.spec[k]=v;

let view='landing',loginMode='register',member=null,teamEntered=false,teamChoice=null,teacher=false,tab='plan',refOpen=false,detailTeam=null,teacherTab='pins';
 let authUser=null,teacherMode='login',pendingMessage='',remoteBusy=false,remoteError='',reflectTimer=null;
 const sleep=t=>new Promise(r=>setTimeout(r,t));
 const showError=e=>{let msg=e?.message||String(e||'작업에 실패했습니다.');console.error('[Supabase]',e);notify('저장/연결 실패: '+msg.slice(0,140));remoteError=msg;};
 const authEmail=x=>String(x||'').trim().toLowerCase();
 function save(){if(!member||!teamEntered)return false;clearTimeout(window.__refsTimer);const n=member.team;window.__refsTimer=setTimeout(()=>saveRefs(n),600);return true}
 async function saveRefs(n){if(!authUser||(!teacher&&member?.team!==n))return;const refs=db.teamData[n].refs;const {error}=await sb.from('hackathon_team_data').update({refs,updated_at:new Date().toISOString()}).eq('team_no',n);if(error)showError(error);else setSyncStatus('참고 이미지 저장 완료')}
 const fieldTimers=new Map();
 function setSyncStatus(s){let el=by('#remote-sync-state');if(el)el.textContent=s}
 function setSpecField(team,field,value){const k=team+':'+field;clearTimeout(fieldTimers.get(k));setSyncStatus('서버에 저장 중…');fieldTimers.set(k,setTimeout(async()=>{const {error}=await sb.rpc('hackathon_set_spec',{p_team:team,p_field:field,p_value:value});if(error)showError(error);else setSyncStatus('✓ Supabase에 저장됨')},650))}
 async function persistReflection(){if(!member||member.team===10||!authUser)return;const rec=db.reflections[member.id];if(!rec)return;const {error}=await sb.from('hackathon_reflections').upsert({user_id:authUser.id,answers:rec.answers||{},ratings:rec.ratings||{},peers:rec.peers||{},status:rec.status||'draft',updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)showError(error);else{setSyncStatus('✓ 개인 평가 저장 완료');let x=by('#reflect-save');if(x)x.textContent='✓ Supabase에 저장됨'}}
 function queueReflection(){clearTimeout(reflectTimer);setSyncStatus('개인 평가 저장 중…');reflectTimer=setTimeout(()=>{persistReflection()},500)}
 async function readGallery(){if(!sb)return;const {data,error}=await sb.rpc('hackathon_gallery');if(error){showError(error);return}for(const it of data||[]){const n=it.team_no;db.teamData[n].work=(it.title?{title:it.title,url:it.url||'',summary:it.summary||'',features:it.features||'',changes:it.changes||'',download_url:safeUrl(it.download_url)||''}:null)}if(!db.teamData[10].work)db.teamData[10].work={...TEACHER_VIBEON_WORK}}
 const toLocalNote=r=>({uid:r.id,id:STUDENTS.find(x=>x.id===r.student_key)?.id||'',author:r.author_name||'참가자',kind:r.kind,text:r.body,date:new Date(r.created_at).toLocaleString('ko-KR'),author_id:r.author_id});
 async function loadTeam(n){
  const [{data:d,error:e1},{data:notes,error:e2},{data:teammates,error:e3}]=await Promise.all([
   sb.from('hackathon_team_data').select('spec,refs,work').eq('team_no',n).single(),
   sb.from('hackathon_notes').select('id,team_no,author_id,kind,body,created_at').eq('team_no',n).order('created_at',{ascending:true}),
   sb.from('hackathon_members').select('user_id,student_key').eq('team_no',n)
  ]);
  if(e1)throw e1;if(e2)throw e2;if(e3)throw e3;const people=Object.fromEntries((teammates||[]).map(x=>[x.user_id,x.student_key]));
  db.teamData[n]={...db.teamData[n],spec:d?.spec||{},refs:d?.refs||[],work:d?.work||null,notes:(notes||[]).map(x=>({...toLocalNote(x),id:people[x.author_id]||'',author:STUDENTS.find(y=>y.id===people[x.author_id])?.name||'참가자'}))};
  if(n===10){db.teamData[10].spec={...TEACHER_VIBEON_SPEC,...db.teamData[10].spec};if(!db.teamData[10].work)db.teamData[10].work={...TEACHER_VIBEON_WORK}}
  if(member&&member.team===n&&n!==10){const {data:r,error:er}=await sb.from('hackathon_reflections').select('answers,ratings,peers,status,updated_at').eq('user_id',authUser.id).maybeSingle();if(er)throw er;if(r)db.reflections[member.id]={answers:r.answers||{},ratings:r.ratings||{},peers:r.peers||{},status:r.status||'draft'};}
 }
 async function loadTeacher(){
  const [m,t,n,r]=await Promise.all([
   sb.from('hackathon_members').select('user_id,student_key,team_no,display_name'),
   sb.from('hackathon_team_data').select('team_no,spec,refs,work'),
   sb.from('hackathon_notes').select('id,team_no,author_id,kind,body,created_at').order('created_at',{ascending:true}),
   sb.from('hackathon_reflections').select('user_id,answers,ratings,peers,status,updated_at')
  ]);
  for(const q of [m,t,n,r])if(q.error)throw q.error;
  db.accounts={};const identities={};for(const x of m.data||[]){identities[x.user_id]=x.student_key;db.accounts[x.student_key]={user_id:x.user_id,created:'Supabase 등록 완료'}}
  for(const x of t.data||[]){db.teamData[x.team_no]={...db.teamData[x.team_no],spec:x.spec||{},refs:x.refs||[],work:x.work||null,notes:[]}}
  for(const x of n.data||[]){const studentKey=identities[x.author_id];db.teamData[x.team_no].notes.push({...toLocalNote(x),id:studentKey||'',author:STUDENTS.find(y=>y.id===studentKey)?.name||'등록자'})}
  db.reflections={};for(const x of r.data||[]){const key=identities[x.user_id];if(key)db.reflections[key]={answers:x.answers||{},ratings:x.ratings||{},peers:x.peers||{},status:x.status||'draft'}}
  db.teamData[10].spec={...TEACHER_VIBEON_SPEC,...db.teamData[10].spec};
  if(!db.teamData[10].work)db.teamData[10].work={...TEACHER_VIBEON_WORK};
 }
 async function hydrateAuth(){
  if(!sb)throw Error('Supabase JavaScript 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');
  const {data:sessionData,error:sessionError}=await sb.auth.getSession();if(sessionError)throw sessionError;
  if(!sessionData?.session){authUser=null;member=null;teacher=false;view='landing';await readGallery();render();return}
  const {data:{user},error}=await sb.auth.getUser();if(error)throw error;
  authUser=user;member=null;teacher=false;teamEntered=false;teamChoice=null;refOpen=false;
  if(!user){view='landing';await readGallery();render();return}
  const {data:isAdmin,error:aerr}=await sb.rpc('hackathon_is_teacher');if(aerr)throw aerr;
  if(isAdmin){teacher=true;await loadTeacher();view='teacher';render();return}
  const {data:record,error:memErr}=await sb.from('hackathon_members').select('student_key,team_no,display_name').eq('user_id',user.id).maybeSingle();if(memErr)throw memErr;
  if(record){member=STUDENTS.find(p=>p.id===record.student_key&&p.team===record.team_no)||null;
   if(!member)throw Error('등록된 학생 명단을 화면에서 찾지 못했습니다. 교사에게 문의하세요.');
   db.accounts[member.id]={user_id:user.id,created:'Supabase 가입 완료'};view='gate';render();return}

function renderNotes(){let arr=db.teamData[member.team].notes;return `<div class="section-head"><div class="eyebrow">STEP 02 · TEAM DISCUSSION</div><h2>함께 생각을 보충해요</h2><p class="muted">계획서에 이미 적은 내용을 다시 쓰지 않고, 구현할 수 있는 방법·우선순위·주의할 점을 논의해요.</p></div><div class="split"><div class="card pad"><h3 style="font-size:20px;margin-bottom:20px">내 의견 남기기</h3><form id="note-form"><div class="field"><label>의견 종류</label><select class="select" name="kind"><option>구현하면 좋은 기능</option><option>교사 피드백을 반영한 대안</option><option>디자인·모바일 아이디어</option><option>구현이 어려운 부분·질문</option><option>팀의 최종 합의</option></select></div><div class="field"><label>내 생각은 무엇인가요?</label><textarea class="textarea" name="text" required maxlength="1500" placeholder="예: 자동 분류 장치는 어렵기 때문에 먼저 입력된 데이터를 자동 집계하는 웹앱을 만들자."></textarea></div><button class="btn block" type="submit">${esc(member.name)} 이름으로 의견 공유하기</button></form><div class="divider"></div><h3 style="font-size:17px;margin-bottom:13px">모둠별 합의 확인</h3><div class="notice">1. 오늘 만들 필수 기능을 3개 이내로 줄였나요?<br>2. 팀원별로 맡을 역할을 정했나요?<br>3. 불가능한 기능은 현실적인 대안으로 바꾸었나요?</div></div><div><div class="heading-line"><h2>모둠 의견 모음</h2><span class="tag violet">${arr.length}개</span></div>${arr.length?`<div class="entry-list">${arr.slice().reverse().map(x=>`<article class="entry"><div class="meta"><b>${esc(x.author)}</b><span>${esc(x.date)}</span></div><span class="tag violet" style="margin-bottom:11px">${esc(x.kind)}</span><p>${esc(x.text)}</p>${x.id===member.id?`<div style="text-align:right;margin-top:11px"><button class="btn small danger" data-act="remove-note" data-id="${esc(x.uid)}">삭제</button></div>`:''}</article>`).join('')}</div>`:`<div class="empty">💬<b>아직 작성된 의견이 없어요.</b>모둠원 각자 한 가지씩 제안하면서 시작해 봐요.</div>`}</div></div><div class="float-footer"><span class="note">친구들의 제안을 읽고 실제 기능·화면 설계로 옮겨 보세요.</span><button class="btn" data-act="tab" data-tab="spec">웹앱 기획하기 →</button></div>`}
function renderSpec(){let spec=db.teamData[member.team].spec;let all=QGROUPS.flatMap(g=>g.questions),required=all.filter(q=>q[4]),done=required.filter(q=>nice(spec[q[0]])).length;return `<div class="page-header"><div><div class="eyebrow">STEP 03 · DESIGN BRIEF</div><h1>웹앱 상세 기획</h1><p>중복되는 문제 정의 대신 화면·기능·모바일 작동 조건을 명확히 정해요.</p></div><span class="tag violet">필수 ${done}/${required.length}</span></div><div class="card pad" style="margin-bottom:19px"><div class="row spread" style="margin-bottom:13px"><b>완성 프롬프트 준비도</b><span id="spec-count" class="tag violet">${done}/${required.length}개</span></div><div class="progressline"><i id="spec-progress" style="width:${Math.round(100*done/required.length)}%"></i></div><p class="note" style="margin-top:11px">입력한 답변은 Supabase에 자동 저장돼요. 모둠원이 같은 내용을 공유합니다. <span id="remote-sync-state">서버 연결됨</span></p></div>${QGROUPS.map((g,gi)=>`<section class="card question-card"><div class="question-head"><span class="qnum">0${gi+1}</span><div><h3>${g.icon} ${esc(g.title)}</h3><p class="note">${esc(g.intro)}</p></div></div>${g.questions.map(q=>`<div class="question-block"><label for="q-${q[0]}">${esc(q[1])}${q[4]?'<span style="color:#ba496b"> *</span>':''}</label><textarea class="textarea" id="q-${q[0]}" data-spec="${q[0]}" placeholder="${esc(q[2])}">${esc(spec[q[0]]||'')}</textarea><p class="helper">${esc(q[3])}</p></div>`).join('')}</section>`).join('')}<div class="card pad"><div class="heading-line"><h2>디자인 참고 이미지</h2><span class="tag">최대 3장 · 이미지당 1MB 이하로 압축</span></div><p class="note" style="margin-bottom:15px">원하는 색·배치·카드 스타일을 참고할 수 있어요. 실제 제작할 때는 같은 이미지를 ChatGPT에도 첨부해 주세요.</p><input id="ref-file" type="file" accept="image/*" class="input" multiple aria-label="참고 이미지 업로드" style="padding:10px"><div class="ref-list" style="margin-top:16px">${(db.teamData[member.team].refs||[]).map((x,i)=>`<div class="ref-item"><img src="${x.data}" alt="참고 이미지 ${i+1}"><button data-act="ref-remove" data-index="${i}" aria-label="참고 이미지 삭제">×</button><span class="filename">${esc(x.name)}</span></div>`).join('')}</div></div><div class="float-footer"><span class="note">* 표시된 필수 질문을 모두 채우면 제작 프롬프트를 생성할 수 있어요.</span><button class="btn" data-act="tab" data-tab="prompt">프롬프트 확인하기 →</button></div>`}
function allRequired(){return QGROUPS.flatMap(g=>g.questions).filter(q=>q[4])}
function buildPrompt(n){let t=SEED[n],s=db.teamData[n].spec;let sections=QGROUPS.map(g=>`## ${g.title}\n`+g.questions.map(q=>`- ${q[1]}\n${nice(s[q[0]])||'(미정: 합리적인 기본값 사용)'}`).join('\n\n')).join('\n\n');let notes=db.teamData[n].notes.map(v=>`- (${v.kind}): ${v.text}`).join('\n')||'(추가 의견 없음)';return `당신은 시니어 모바일 웹 프론트엔드 개발자이자 사용성 설계 전문가입니다. 다음 원문 계획서와 학생 합의 내용을 정확히 반영하여, 학교 해커톤 웹앱의 **1차 초안**을 만들어 주세요. 아직 Supabase 연결과 GitHub 업로드는 하지 않습니다. 질문을 다시 반복하지 말고, 빠진 세부사항은 아래 설계와 일관되는 합리적인 기본값을 선택해 실제로 작동하는 결과물을 먼저 제시하세요.\n\n[프로젝트 / 작성자]\n제1회 호연고 해커톤 · ${n}모둠\n모둠원 이름은 제작 결과에 필요하지 않으므로 생략합니다.\n\n[1. 학생이 미리 제출한 문제 해결 계획서 — 원문이며 임의로 바꾸지 마세요]\n${t.plan}\n\n[2. 사전 교사 피드백 — 실현 가능 범위와 주의사항]\n${t.feedback}\n\n[3. 팀원들이 추가로 제안한 의견]\n${notes}\n\n[4. 모둠이 합의한 구체적 웹앱 명세]\n${sections}\n\n[5. 구현 필수 기준]\n1. HTML/CSS/바닐라 JavaScript로 1차 초안을 만들고, 먼저 index.html 하나로 실행 가능한 모습을 보여 주세요. 지금은 Supabase 연결 코드와 GitHub 배포를 요구하지 않습니다. 외부 API나 서버가 필수라면 실제 작동과 시연 모드를 명확히 구분하고 대체 동작을 완성해 주세요.\n2. MOBILE FIRST: 360px/390px(휴대폰)에서 가로 스크롤과 요소 잘림 없이 보이게 해 주세요. 버튼의 터치 영역은 가급적 44x44px 이상, 본문은 읽기 쉬운 크기, 카드 1열, 명확한 화면 이동을 우선하세요. 768px 태블릿과 1280px PC에도 반응형으로 배치하세요.\n3. 각 화면은 모둠이 명세한 내용과 동선 그대로 만드세요. 모든 버튼·탭·입력·검색·추가·삭제·결과 기능이 실제 작동하도록 구현하세요. 장식뿐인 버튼, 빈 더미 링크, 미완성 TODO 코드를 남기지 마세요.\n4. 데이터가 필요한 기능은 실제 예시 데이터와 입력 검증, 빈 결과, 오류 안내, 초기화/다시 하기까지 갖추세요. 서버 미연결 시 같은 기기에서 시험하도록 localStorage를 사용하되, 여러 기기 공유처럼 허위로 표현하지 마세요.\n5. 가공 데이터·AI 자동 판정·실제 정확도·물리 장치 제어 등 검증하지 않은 기능은 진짜처럼 표현하지 마세요. 필요하면 교육용 시뮬레이션·사용자 입력 방식으로 구현하고 한계를 UI에 명시하세요.\n6. 디자인은 한눈에 읽히는 굵은 제목, 일관된 색, 정돈된 카드, 충분한 여백, 명확한 CTA 중심으로 구현하세요. 접근 가능한 대비와 키보드 입력도 고려하세요.\n7. 우선 미리보기 가능한 초안의 전체 index.html 코드를 제공하고, 주요 버튼 작동 상태·개선 사항·향후 Supabase 데이터 연동 필요 사항·360/390/768/1280px 테스트 체크리스트를 정리해 주세요. 최종본은 나중에 별도 프롬프트로 요청합니다.\n8. 인터넷 연결이 없으면 작동하지 않는 외부 패키지 의존성을 되도록 피하세요. 보안키/개인정보를 코드에 포함하지 마세요.\n9. 프로젝트 원래 의도와 사전 피드백이 충돌할 때는 피드백의 구현 가능 범위를 우선하되, 왜 조정했는지 결과물에서 분명하게 알려 주세요.\n\n중요: 설명만 하지 말고, 바로 미리보고 기능을 점검할 수 있는 초안 코드를 작성하세요. 최종 Supabase 연결은 다음 단계에서 진행합니다.`}
function renderPrompt(){let required=allRequired(),spec=db.teamData[member.team].spec,missing=required.filter(q=>!nice(spec[q[0]]));return `<div class="page-header"><div><div class="eyebrow">STEP 04 · AI PROMPT</div><h1>① ChatGPT 초안 제작 프롬프트</h1><p>지금은 디자인과 기능을 시험할 첫 버전을 만들어요. Supabase 연결은 뒤 단계의 최종본 프롬프트에서 진행합니다.</p></div><span class="tag ${missing.length?'amber':'mint'}">${missing.length?'필수 '+missing.length+'문항 남음':'제작 준비 완료'}</span></div>${missing.length?`<div class="notice amber" style="margin-bottom:17px"><b>프롬프트를 복사하려면 아래 필수 질문을 채워 주세요.</b><div style="margin-top:8px">${missing.map(x=>`• ${esc(x[1])}`).join('<br>')}</div><button class="btn small outline" style="margin-top:13px" data-act="tab" data-tab="spec">기획 돌아가기</button></div>`:`<div class="notice mint" style="margin-bottom:17px">기획 질문을 모두 채웠어요. 아래 초안 프롬프트를 ChatGPT에 붙여넣고 참고 이미지를 함께 첨부하세요. 초안을 미리 실행한 뒤 Supabase와 최종 연결을 진행합니다.</div>`}<div class="card pad"><div class="headline"><h2>초안 제작 프롬프트 미리보기</h2><span class="tag violet">${(buildPrompt(member.team).length).toLocaleString()}자</span></div><div class="prompt-preview" id="prompt-preview">${esc(buildPrompt(member.team))}</div><div class="float-footer"><span class="note">먼저 초안을 시험한 뒤, 「제작·배포」에서 최종본을 완성하세요.</span><div class="row wrap"><button class="btn outline" data-act="download-prompt">TXT 저장</button><button class="btn" ${missing.length?'disabled':''} data-act="copy-prompt">초안 프롬프트 복사</button></div></div></div>`}
async function copyGuideText(value,message){try{await navigator.clipboard.writeText(value)}catch{let t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}notify(message)}
function shotsFor(group){return GUIDE_SCREENSHOTS.filter(x=>x.group===group).map((x,i)=>`<button type="button" class="shot-tile" data-act="guide-shot" data-shot="${esc(x.id)}" aria-label="${esc(x.caption)} 자세히 보기"><img src="${x.data}" alt="${esc(x.caption)}" loading="lazy"><span class="shot-zoom">클릭해서 확대 ↗</span><b>${String(i+1).padStart(2,'0')} · ${esc(x.caption)}</b></button>`).join('')}
function buildSQLPrompt(n){let name=nice(db.teamData[n].spec.name)||`${n}모둠 프로젝트`;let answers=QGROUPS.flatMap(g=>g.questions).filter(q=>/feature|data|input|output|scope|privacy|save|persist/i.test(q[0])||/저장|입력|기능|사용자/.test(q[1])).map(q=>`${q[1]}\n${nice(db.teamData[n].spec[q[0]])||'(미정)'}`).join('\n\n');return `당신은 Supabase/PostgreSQL 데이터베이스 및 보안 설계 전문가입니다. 아래 웹앱에 필요한 데이터만 저장하도록 안전한 SQL을 만들어 주세요.\n\n[웹앱] ${name}\n[구체적 기능·데이터]\n${answers}\n\n[요구사항]\n1. 데이터베이스가 꼭 필요한지 먼저 판단하고, 같은 기기에서만 사용할 앱이라면 localStorage 대안도 설명하세요.\n2. 필요한 테이블, 컬럼, 기본키, 생성/수정 시각, 제약조건을 포함한 Supabase SQL Editor 실행용 SQL을 작성하세요.\n3. 개인 데이터가 있으면 Supabase Auth로 로그인한 각 사용자 본인의 데이터만 접근하도록 auth.uid() 기반 RLS 정책을 함께 작성하세요. 모둠 공유 데이터는 인증된 팀원에게만 허용하는 안전한 설계를 제안하세요.\n4. 익명 사용자가 모든 개인정보를 읽거나 수정할 수 있도록 하는 공개 정책은 만들지 마세요.\n5. SQL을 실행한 뒤 Table Editor와 Authentication에서 확인할 내용을 안내하세요.\n6. Secret/service_role 키를 웹브라우저 코드에 절대 넣지 마세요.\n7. 웹앱 최종본을 만들 때 필요한 테이블 구조 요약도 함께 제공하세요.\n8. 학생 개인정보, 실명, 개인 PIN 저장은 가급적 피하고 서비스 이용에 불필요한 민감정보를 만들지 마세요.\n\n실제로 실행할 수 있는 SQL을 코드 블록에 제시하고, 필요한 인증 설정이나 추가 작업이 있으면 SQL만으로 완성된 것처럼 설명하지 마세요.`}
function buildFinalPrompt(n,url,key,sql){let t=SEED[n],v=db.teamData[n].spec,project=nice(v.name)||`${n}모둠 웹앱`;return `당신은 숙련된 모바일 웹 개발자이자 Supabase 데이터 연동 전문가입니다. 이 대화에서 앞서 제작한 웹앱의 **1차 초안**을 검토한 후, 실제로 배포할 **최종 index.html**을 완성해 주세요.\n\n[프로젝트 정보]\n- 웹앱: ${project}\n- 모둠: ${n}모둠\n- 이번 해커톤의 실제 구현 범위는 아래 기획을 따릅니다.\n\n[문제 해결 계획서]\n${t.plan}\n\n[최종 기획 답변]\n${QGROUPS.map(g=>'■ '+g.title+'\n'+g.questions.map(q=>q[1]+'\n'+(nice(v[q[0]])||'(추가 결정 필요)')).join('\n\n')).join('\n\n')}\n\n[Supabase 연결 정보 — 이 팀의 프로젝트]\nProject URL: ${url}\nPublishable key: ${key}\n\n[이미 생성한 Supabase SQL / 테이블 구조]\n${nice(sql)||'이 채팅에서 SQL을 작성했다면 그 내용을 참조하세요. 구조가 확인되지 않으면 테이블명/컬럼/RLS 정책을 먼저 질문하세요.'}\n\n[최종본 필수 구현 사항]\n1. 기존 1차 초안의 디자인과 이미 확인된 버튼·기능을 유지하면서 오류와 모바일 사용성을 개선해 주세요.\n2. 저장이 필요한 정보는 실제 Supabase 테이블 구조에 맞춰 저장·조회·수정·삭제하도록 연동하세요. supabase-js v2를 사용할 수 있습니다. 로그인/세션/RLS 정책이 필요한 경우 Supabase Auth를 사용하세요.\n3. Publishable key만 브라우저에 사용하고, service_role·secret 키나 DB 비밀번호는 절대로 HTML에 넣지 마세요. RLS를 우회하는 방식으로 구현하지 마세요.\n4. Supabase에 권한이 없어 기능이 실패하면 성공한 척하지 말고 오류·해결 단계를 사용자에게 보여 주세요. 새로고침·재접속 시 데이터 유지와 다른 계정의 데이터 접근 차단도 검증해 주세요.\n5. GitHub Pages에 바로 업로드 가능한 index.html 전체 코드를 제공해 주세요. 추가 파일이 꼭 필요하면 파일명과 구조도 명확히 안내해 주세요. GitHub 자체에 Supabase 키를 입력하는 절차가 아니라 웹앱 코드에서 Supabase를 사용하는 구조임을 지켜 주세요.\n6. 모바일 360px/390px, 태블릿 768px, PC 1280px에서 메뉴·버튼·입력창이 잘리는 문제가 없게 해 주세요.\n7. 필요 없는 기능은 추가하지 말고 사용자가 모든 버튼을 직접 테스트할 수 있게 해 주세요.\n8. 최종 코드 다음에 [GitHub Pages 배포], [Supabase 연결 테스트], [RLS/인증 점검], [고장 시 확인 순서]를 짧고 구체적으로 안내해 주세요.\n\n중요: 실제 코드를 제공하지 않고 설명만 끝내지 마세요. 기존 초안 코드가 이 대화에 보이지 않으면 index.html 파일을 요청하세요. SQL 구조가 없거나 모호한 경우 추측해서 연결했다고 주장하지 마세요.`}
function renderGuide(){let isTeacher=member?.team===10;return `<div class="section-head"><div class="eyebrow">STEP 05 · FROM DRAFT TO DEPLOY</div><h2>초안에서 실제 웹앱 배포까지</h2><p class="muted">먼저 ChatGPT에서 초안을 만들고, Supabase로 데이터베이스를 준비한 뒤, 다시 ChatGPT에서 최종본을 완성해 GitHub Pages에 올려요.</p></div><div class="guide-path">${[['01','ChatGPT','초안 만들기'],['02','Supabase','가입·프로젝트'],['03','Supabase','SQL 설정'],['04','ChatGPT','최종본 연결'],['05','GitHub','배포하기'],['06','테스트','작동 확인']].map(x=>`<a href="#guide-${x[0]}" class="guide-path-item"><b>${x[0]}</b><span>${x[1]}<small>${x[2]}</small></span></a>`).join('')}</div><div class="notice mint" style="margin-bottom:22px"><b>기억하세요!</b> 첫 프롬프트는 기능과 디자인을 확인할 <b>초안용</b>이고, 아래에서 URL·Publishable key를 포함해 생성하는 프롬프트는 <b>실제 최종본 제작용</b>이에요. GitHub와 Supabase가 직접 연결되는 게 아니라, 웹앱의 JavaScript가 Supabase와 통신하는 방식입니다.</div>
<section class="guide-phase" id="guide-01"><div class="guide-phase-head"><span class="guide-phase-number">01</span><div><span class="eyebrow">CHATGPT · FIRST DRAFT</span><h3>ChatGPT에서 1차 초안 만들기</h3><p>위쪽 <b>「초안 프롬프트」</b> 탭에서 프롬프트를 복사해 ChatGPT 새 대화에 붙여넣어요. 참고 이미지가 있다면 함께 첨부하세요. 버튼을 직접 눌러보며 디자인·기능을 점검해요.</p></div></div><div class="guide-inline-action"><button class="btn small" data-act="tab" data-tab="prompt">초안 프롬프트 복사하러 가기 →</button><a class="btn small outline" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT 열기 ↗</a></div><div class="shot-grid">${shotsFor('draft')}</div></section>
<section class="guide-phase" id="guide-02"><div class="guide-phase-head"><span class="guide-phase-number">02</span><div><span class="eyebrow">SUPABASE · ACCOUNT & PROJECT</span><h3>Supabase 가입하고 프로젝트 만들기</h3><p>Supabase에 가입하거나 로그인한 후 Organization을 만들고, 그 안에 <b>New project</b>를 생성하세요. 프로젝트 이름과 데이터베이스 비밀번호를 설정하고, 비밀번호는 남에게 공유하지 마세요.</p></div></div><div class="guide-inline-action"><a class="btn small outline" href="https://supabase.com/dashboard/projects" target="_blank" rel="noopener noreferrer">Supabase 프로젝트 열기 ↗</a></div><div class="shot-grid">${shotsFor('supabase')}</div><div class="notice amber"><b>캡처에 없는 화면</b> · Organization 생성 다음에는 반드시 <b>New project</b>를 눌러 프로젝트를 생성해야 SQL Editor를 사용할 수 있어요. Free 요금제 이용 가능 여부와 가입 조건은 서비스 안내를 따라요.</div></section>
<section class="guide-phase" id="guide-03"><div class="guide-phase-head"><span class="guide-phase-number">03</span><div><span class="eyebrow">SUPABASE · DATABASE SETUP</span><h3>SQL Editor에서 데이터베이스 준비하기</h3><p>우리 웹앱에 저장할 항목을 ChatGPT에 알려 SQL을 만든 다음 <b>SQL Editor → New query → 붙여넣기 → Run</b> 순서로 진행하세요. <b>Table Editor</b>에서 테이블이 생겼는지 확인해요.</p></div></div><div class="card guide-helper"><b>SQL 생성 요청 프롬프트</b><p class="note">우리 모둠 기획에 맞는 테이블과 RLS 정책을 작성하도록 ChatGPT에 요청해요.</p><div class="guide-inline-action"><button class="btn small" data-act="copy-sql-prompt">SQL 생성 요청 프롬프트 복사</button><button class="btn small outline" data-act="download-sql-prompt">TXT로 저장</button></div></div><div class="shot-grid">${shotsFor('sql')}</div><div class="notice amber"><b>RLS 주의</b> · 초록색 <b>Run and enable RLS</b>는 보안의 시작일 뿐이에요. 실제 저장·조회가 가능하려면 인증 방식에 맞는 RLS <b>정책</b>도 필요합니다. 화면의 예시 SQL은 복사하지 말고, 우리 팀에 맞게 생성한 SQL을 실행하세요.</div></section>
<section class="guide-phase" id="guide-04"><div class="guide-phase-head"><span class="guide-phase-number">04</span><div><span class="eyebrow">SUPABASE → CHATGPT · FINAL BUILD</span><h3>Project URL과 Publishable key로 최종본 만들기</h3><p>Supabase 프로젝트의 <b>Connect → Copy</b>에서 두 연결 정보를 복사하세요. 아래 입력칸에 붙여넣으면 <b>기존 초안 + Supabase 연동 + GitHub Pages 배포</b>를 함께 요청하는 최종본 프롬프트가 만들어져요.</p></div></div><div class="shot-grid">${shotsFor('keys')}</div><div class="card pad final-prompt-maker"><div class="row spread wrap"><h3>🔗 최종본 연결 프롬프트 생성기</h3><span class="tag violet">초안과 별도</span></div><p class="note">각 팀이 <b>자기 Supabase 프로젝트</b>에서 복사한 값을 붙여넣으세요. 아래 입력값은 다른 팀에 공개되지 않도록 여기서는 브라우저에서만 사용해요.</p><div class="field"><label for="guide-project-url">① Project URL <span class="required">*</span></label><input class="input" id="guide-project-url" type="url" placeholder="https://xxxxxxxx.supabase.co" spellcheck="false" autocomplete="off"><p class="helper">Supabase 프로젝트 첫 화면 → Copy → Project URL</p></div><div class="field"><label for="guide-publishable-key">② Publishable key <span class="required">*</span></label><input class="input" id="guide-publishable-key" type="text" placeholder="sb_publishable_..." spellcheck="false" autocomplete="off"><p class="helper">Copy → Publishable key · Secret / service_role 키는 절대 입력하지 마세요.</p></div><div class="field"><label for="guide-sql">③ SQL 코드 또는 테이블 구조 (권장)</label><textarea class="textarea" id="guide-sql" rows="5" placeholder="CREATE TABLE ... 또는 테이블명, 컬럼, RLS 정책을 붙여넣으세요."></textarea><p class="helper">SQL을 이전 ChatGPT 대화에서 만들었다면 같은 대화를 유지하고, 테이블 구조가 전달되었는지 확인하세요.</p></div><div class="guide-inline-action"><button class="btn" data-act="copy-final-prompt">최종본 프롬프트 생성·복사</button><button class="btn outline" data-act="download-final-prompt">TXT 다운로드</button></div><div class="notice mint" style="margin-top:14px">모둠의 처음 만든 초안이 있는 <b>같은 ChatGPT 대화</b>에 붙여넣으세요. 새 대화라면 이전 index.html 파일도 함께 첨부해야 해요.</div><div id="guide-final-status" class="guide-status" aria-live="polite"></div></div></section>
<section class="guide-phase" id="guide-05"><div class="guide-phase-head"><span class="guide-phase-number">05</span><div><span class="eyebrow">GITHUB · PUBLISH</span><h3>GitHub 가입 → index.html 업로드 → Pages 배포</h3><p>최종 HTML을 받은 뒤 GitHub에 새 저장소를 만들어요. 파일 이름을 <b>index.html</b>로 확인하고 업로드해요. <b>Settings → Pages → Deploy from a branch → main → /(root) → Save</b>를 누르고 공개 주소를 확인하세요.</p></div></div><div class="guide-inline-action"><a class="btn small outline" href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub 열기 ↗</a></div><div class="shot-grid">${shotsFor('github')}</div><div class="notice amber"><b>배포할 때</b> · HTML에 <b>Secret key</b>나 데이터베이스 비밀번호를 넣지 마세요. 수정한 HTML은 다시 업로드/커밋해야 사이트에 반영돼요.</div></section>
<section class="guide-phase" id="guide-06"><div class="guide-phase-head"><span class="guide-phase-number">06</span><div><span class="eyebrow">FINAL CHECK</span><h3>웹앱과 데이터 저장 제대로 확인하기</h3><p>GitHub Pages의 <b>Visit site</b>로 접속해 아래 항목을 점검한 다음, 모둠의 <b>작품 제출</b>에 공개 주소를 입력해요.</p></div></div><div class="guide-test-list">${['웹앱이 PC와 휴대폰에서 열리는가?','주요 입력·검색·추가·수정 버튼이 실제 작동하는가?','Supabase에 데이터를 저장하고 Table Editor에서 확인했는가?','새로고침 후 데이터가 남고, 다른 계정의 비공개 데이터는 보이지 않는가?','오류 메시지가 나오는 상황을 시험하고 수정했는가?'].map((x,i)=>`<label><input type="checkbox" class="guide-check" data-check="${i}"><span>${esc(x)}</span></label>`).join('')}</div><div class="guide-inline-action"><button class="btn" data-act="tab" data-tab="submit">완성 작품 제출하기 →</button></div></section>
<div class="guide-bottom"><b>6단계 완료!</b><p>이후 수정 사항이 생기면 ChatGPT에서 최종 HTML을 고치고 GitHub에 다시 업로드하세요. Supabase SQL 변경이 필요한 경우 RLS도 함께 점검하세요.</p></div>`}
function renderSubmit(){let w=db.teamData[member.team].work||{},isTeacherSample=member.team===10,file=db.teamData[10]?.fileName;return `<div class="section-head"><div class="eyebrow">STEP 06 · SHARE YOUR WORK</div><h2>${isTeacherSample?'교사 예시 작품 등록':'완성 작품 제출'}</h2><p class="muted">${isTeacherSample?'교사 예시는 작품 공유회 맨 앞에 고정돼요.':'작품을 제출하면 작품 공유회에 자동으로 모여요.'}</p></div><div class="card pad"><form id="work-form"><div class="grid2"><div class="field"><label>작품 이름 <span class="required">*</span></label><input class="input" name="title" required maxlength="80" placeholder="예: 방송실 장비 찾기" value="${esc(w.title||'')}"></div><div class="field"><label>작품 링크 (https://) ${isTeacherSample?'(선택)':'*'}</label><input class="input" name="url" ${isTeacherSample?'':'required'} type="url" placeholder="https://..." value="${esc(w.url||'')}"></div></div><div class="field"><label>📦 설치·다운로드 링크 (선택)</label><input class="input" name="download_url" type="url" inputmode="url" placeholder="https://... (앱 설치 페이지, APK·ZIP 등의 다운로드 주소)" value="${esc(w.download_url||'')}"><p class="helper">설치형 앱이나 게임 파일을 공개하고 싶을 때만 입력하세요. Google Play·App Store·GitHub Releases 등의 HTTPS 주소를 사용하세요. 이 사이트에 파일이 직접 업로드되지는 않습니다.</p></div>${isTeacherSample?`<div class="field sample-upload-field"><label>또는 예시 HTML 파일 올리기</label><input class="input" id="teacher-example-file" type="file" accept=".html,.htm,text/html"><p class="helper" id="example-upload-state">${file?'등록된 파일: '+esc(file):'HTML 파일 미리보기는 현재 기기에서만 됩니다. 다른 기기에서도 실행하려면 GitHub Pages URL을 등록하세요.'}</p></div>`:''}<div class="field"><label>프로그램 개요 <span class="required">*</span></label><textarea class="textarea" name="summary" required maxlength="600" placeholder="어떤 문제를 누구를 위해 해결하는 프로그램인가요? 2~4문장으로 설명해 주세요.">${esc(w.summary||'')}</textarea></div><div class="field"><label>실제로 구현된 핵심 기능 <span class="required">*</span></label><textarea class="textarea" name="features" required maxlength="700" placeholder="1. 사용자에게 보이는 기능
2. 실제 입력하면 동작하는 기능
3. 모바일에서 확인한 점">${esc(w.features||'')}</textarea></div><div class="field"><label>제작하면서 가장 많이 바뀐 점</label><textarea class="textarea" name="changes" maxlength="600" placeholder="처음 계획과 달라진 부분과 이유를 작성하세요.">${esc(w.changes||'')}</textarea></div><button type="submit" class="btn">${w.title?'제출 내용 수정 저장하기':isTeacherSample?'교사 예시 등록하기':'우리 모둠 작품 제출하기'} →</button></form></div><div style="margin-top:20px"><button class="btn outline" data-act="tab" data-tab="gallery">작품 공유회 보기</button></div>`}
function renderGallery(){let items=[{n:10,w:db.teamData[10].work||{title:'바이브온(VibeON)',summary:'웹앱 기획부터 배포까지의 교사 예시입니다. 현재는 기획 자료이며 체험 링크 등록 전입니다.'},sample:true},...Array.from({length:9},(_,i)=>({n:i+1,w:db.teamData[i+1].work})).filter(x=>x.w&&x.w.title)];let studentCount=items.length-1;return `<div class="section-head"><h2>제1회 호연고 해커톤 작품 공유회</h2><p class="muted">작품을 웹에서 실행하거나, 제작자가 등록한 설치·다운로드 링크로 이용할 수 있어요. <b>전체보기</b>에서 공개된 기획 과정도 확인해 보세요.</p><p class="note" style="margin-top:6px">설치 파일은 외부 사이트에서 제공돼요. 다운로드 전 파일 출처와 기기 호환성을 확인하세요.</p></div><div class="row wrap" style="margin-bottom:22px"><span class="tag violet">학생 작품 ${studentCount} / 9모둠</span><span class="tag mint">교사 예시 맨 앞 고정</span></div><div class="gallery">${items.map((x,i)=>{let isSample=x.n===10,w=x.w,hasWork=!!db.teamData[x.n].work,hasFile=!!db.teamData[10].fileHtml,link=safeUrl(w.url);return `<article class="project-card ${isSample?'gallery-teacher-sample':''}"><div class="project-banner">${isSample?`<img class="teacher-style-banner" src="${TEACHER_STYLE_REFERENCE}" alt="바이브온 디자인 참고 이미지"><span class="teacher-style-label">VibeON · 아이디어를 켜다</span>`:['🎙️','🌡️','📊','🎬','♻️','🧬','📚','🌿','📰'][x.n-1]}${isSample?'<span class="sample-order">01 · 교사 예시</span>':''}</div><div class="project-card-body"><span class="tag ${isSample?'mint':'violet'}" style="align-self:flex-start">${isSample?'교사 예시 · 10모둠':x.n+'모둠'}</span><h3>${esc(w.title)}</h3><p>${esc(w.summary||'')}</p><div class="note">제작: ${esc(SEED[x.n].members)}</div><div class="card-footer">${hasWork?`<button class="btn small" data-act="detail" data-no="${x.n}">전체보기</button>`:`<span class="tag">등록 준비 중</span>`}${isSample&&hasFile?`<button class="btn small outline" data-act="sample-preview">예시 체험 ↗</button>`:link?`<a class="btn small outline" href="${esc(link)}" target="_blank" rel="noopener noreferrer">웹앱 실행 ↗</a>`:''}${safeUrl(w.download_url)?`<a class="btn small outline" href="${esc(safeUrl(w.download_url))}" target="_blank" rel="noopener noreferrer nofollow" aria-label="${esc(w.title)} 설치 또는 다운로드 주소 열기">⬇ 설치·다운로드</a>`:''}</div></div></article>`}).join('')}</div>`}
function renderReflect(){if(!refOpen)return `<div class="card pad lock" style="text-align:center"><div class="icon">🔐</div><div class="eyebrow">PERSONAL REFLECTION</div><h2 style="font-size:26px;margin-bottom:12px">나만의 소감·평가</h2><p class="muted" style="margin-bottom:23px">${esc(member.name)} 학생의 기록입니다. 이 체험본의 기록은 Supabase 인증으로 보호하며 본인과 교사만 열람할 수 있어요. 공용 PC에서는 활동 후 반드시 로그아웃하세요.</p><button class="btn block" data-act="unlock-reflect">내 기록 열기 →</button></div>`;
let r=db.reflections[member.id]||{answers:{},ratings:{},peers:{},status:'draft'};let peers=STUDENTS.filter(s=>s.team===member.team&&s.id!==member.id);return `<div class="page-header"><div><div class="eyebrow">PRIVATE · ${esc(member.name)}</div><h1>나의 해커톤 소감문</h1><p>Supabase 계정으로 보호합니다. 작성한 내용은 서버에 자동 저장돼요.</p></div><div class="row wrap"><span class="tag mint">Supabase 안전 저장</span><span class="tag">${r.status==='submitted'?'제출됨 · 다시 수정 가능':'임시 작성 중'}</span></div></div><form id="reflect-form"><section class="card pad" style="margin-bottom:17px"><h2 class="step-title">① 경험을 구체적으로 되돌아보기</h2><p class="subtext">“열심히 했다”보다 내가 실제로 했던 행동·결과·어려움을 적어 주세요.</p>${REFLECTIONS.map((q,i)=>`<div class="question-block"><label for="${q[0]}">${i+1}. ${esc(q[1])}</label><textarea id="${q[0]}" class="textarea" data-ref="${q[0]}" placeholder="구체적인 예시나 상황을 넣어 작성하세요.">${esc(r.answers?.[q[0]]||'')}</textarea></div>`).join('')}</section><section class="card pad" style="margin-bottom:17px"><h2 class="step-title">② 자기평가</h2><p class="subtext">1점(더 노력 필요)부터 5점(매우 적극적)까지 자신의 행동을 근거로 평가해요.</p>${SELF.map(x=>`<div class="self-rating"><div class="rating-row"><div><b>${esc(x[1])}</b><p class="note">${esc(x[2])}</p></div><select class="select" data-rating="${x[0]}">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(r.ratings?.[x[0]]||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div></div>`).join('')}<div class="field" style="margin-top:19px"><label>자기평가 근거: 가장 적극적으로 참여한 순간과 개선할 점</label><textarea class="textarea" data-ref="self_evidence" placeholder="예: 필요한 기능을 제안하고 테스트를 맡았으나, 발표 준비는 더 적극적으로 참여할 필요가 있었다.">${esc(r.answers?.self_evidence||'')}</textarea></div></section><section class="card pad"><h2 class="step-title">③ 동료평가</h2><p class="subtext">모둠원 각자의 참여와 협력을 사실에 근거해 평가해요. Supabase에 개인별로 비공개 저장되며 본인과 교사만 읽을 수 있어요.</p>${peers.map(p=>{let pr=r.peers?.[p.id]||{};return `<div class="self-rating" style="margin-bottom:12px"><div class="row spread" style="margin-bottom:12px"><b>${esc(p.name)}</b><span class="tag violet">${member.team}모둠</span></div><div class="rating-row"><label for="score-${encodeURIComponent(p.id)}">활동 참여도</label><select class="select" id="score-${encodeURIComponent(p.id)}" data-peer="${esc(p.id)}" data-peerfield="participation">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(pr.participation||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div><div class="rating-row"><label>협력과 의견 존중</label><select class="select" data-peer="${esc(p.id)}" data-peerfield="cooperation">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(pr.cooperation||0)===v?'selected':''}>${v?v+'점':'선택하세요'}</option>`).join('')}</select></div><div class="field"><label>그 친구가 실제로 기여한 내용과 개선하면 좋을 점</label><textarea class="textarea" data-peer="${esc(p.id)}" data-peerfield="evidence" placeholder="구체적인 행동을 중심으로 공정하게 작성하세요.">${esc(pr.evidence||'')}</textarea></div></div>`}).join('')}</section><div class="float-footer"><span class="note" id="reflect-save">작성한 내용은 자동으로 임시 저장돼요.</span><div class="row wrap"><button class="btn outline" type="button" data-act="lock-reflect">잠그고 나가기</button><button class="btn" type="submit">소감·평가 제출하기</button></div></div></form>`}
function detailOverlay(n){let d=SEED[n],t=db.teamData[n],s=t.spec||{},w=t.work||{};let plan=planCard(n);let notes=t.notes.length?t.notes.map(v=>`<div class="entry"><div class="meta"><b>${esc(v.author)} · ${esc(v.kind)}</b><span>${esc(v.date)}</span></div><p>${esc(v.text)}</p></div>`).join(''):'<div class="empty">작성된 추가 의견이 없습니다.</div>';return `<div class="drawer-bg" id="detail-bg"><div class="drawer" role="dialog" aria-modal="true" aria-label="${n}모둠 작품 상세"><div class="drawer-head"><div><span class="tag violet">${n}모둠 · 제작 과정</span><h2 style="margin-top:12px">${esc(w.title||'모둠 결과물')}</h2><p class="muted">${esc(d.members)}</p></div><button class="drawer-close" data-act="close-detail" aria-label="닫기">×</button></div><h3 style="margin-bottom:12px">작품 소개</h3><p>${esc(w.summary||'')}</p>${safeUrl(w.url)||safeUrl(w.download_url)?`<div class="row wrap" style="margin:17px 0 4px;gap:9px">${safeUrl(w.url)?`<a class="btn small" href="${esc(safeUrl(w.url))}" target="_blank" rel="noopener noreferrer">웹앱 실행 ↗</a>`:''}${safeUrl(w.download_url)?`<a class="btn small outline" href="${esc(safeUrl(w.download_url))}" target="_blank" rel="noopener noreferrer nofollow">⬇ 설치·다운로드</a>`:''}</div><p class="note">설치 전에 파일의 출처와 기기 호환성을 확인하세요.</p>`:''}<div class="divider"></div>${plan}<div class="divider"></div><h3 style="margin-bottom:15px;font-size:21px">팀원들이 나눈 생각</h3><div class="entry-list">${notes}</div><div class="divider"></div><h3 style="margin-bottom:15px;font-size:21px">웹앱 기획 단계의 실제 답변</h3>${QGROUPS.map(g=>{let present=g.questions.filter(q=>nice(s[q[0]]));if(!present.length)return '';return `<div class="card pad" style="margin-bottom:11px"><h4 style="font-size:17px;margin-bottom:9px">${esc(g.title)}</h4>${present.map(q=>`<div class="work-row"><strong>${esc(q[1])}</strong><p>${esc(s[q[0]])}</p></div>`).join('')}</div>`}).join('')||'<div class="empty">작성된 기획 답변이 없습니다.</div>'}<div class="divider"></div><button class="btn block" data-act="close-detail">전체보기 닫기</button></div></div>`}
 function teacherGate(){layout(`<div class="card pad" style="max-width:540px;margin:48px auto"><div class="eyebrow">TEACHER CONSOLE · SUPABASE AUTH</div><h1 style="font-size:29px;margin-bottom:13px">교사 로그인</h1><p class="muted" style="margin-bottom:18px">교사용 계정은 Supabase Auth로 로그인합니다. 기존의 공개된 4자리 교사 코드는 더 이상 사용하지 않아요.</p><div class="login-tabs"><button type="button" data-act="set-teacher-mode" data-mode="login" class="${teacherMode==='login'?'active':''}">교사 로그인</button><button type="button" data-act="set-teacher-mode" data-mode="register" class="${teacherMode==='register'?'active':''}">교사 첫 등록</button></div><form id="${teacherMode==='register'?'teacher-signup-form':'teacher-form'}"><div class="field"><label>교사 이메일</label><input type="email" class="input" name="email" required autocomplete="email" placeholder="이메일"></div><div class="field"><label>${teacherMode==='register'?'새 비밀번호(8자 이상)':'비밀번호'}</label><input type="password" class="input" name="password" ${teacherMode==='register'?'minlength="8"':''} required autocomplete="${teacherMode==='register'?'new-password':'current-password'}" placeholder="비밀번호"></div><div class="field"><label>교사 전용 1회 등록 코드 ${teacherMode==='register'?'':'(첫 등록한 계정만)'}</label><input class="input" name="code" type="text" ${teacherMode==='register'?'required':''} autocomplete="off" placeholder="SQL Editor에서 확인한 교사 등록 코드"></div><button class="btn block" type="submit">${teacherMode==='register'?'교사 계정 만들기':'교사 로그인'} →</button></form><p class="note" style="margin-top:16px">교사 등록 코드는 SQL Editor의 마지막 조회에서 확인하고 외부에 공개하지 마세요.</p></div>`)}
 function pendingPage(){layout(`<div class="card pad" style="max-width:590px;margin:42px auto"><div class="eyebrow">FIRST-TIME SETUP</div><h1 style="font-size:27px;margin-bottom:12px">계정 등록 마무리</h1><p class="muted" style="margin-bottom:16px">이메일 인증을 마쳤다면 본인 계정을 명단에 연결하세요. 이미 다른 학생이 등록한 이름을 선택할 수 없습니다.</p><form id="pending-student-form"><div class="field"><label>내 이름</label><select class="select" name="student" required><option value="">이름 선택</option>${Array.from({length:9},(_,i)=>memberOptions(i+1)).join('')}</select></div><div class="field"><label>개인 등록 코드</label><input class="input" type="text" name="code" required autocomplete="off" placeholder="교사가 전달한 개인 코드"></div><button class="btn block" type="submit">내 모둠 등록 완료 →</button></form><div class="divider"></div><h3 style="margin-bottom:10px">교사 계정인 경우</h3><form id="pending-teacher-form"><div class="field"><label>교사용 1회 등록 코드</label><input class="input" type="text" name="code" autocomplete="off" required placeholder="교사 전용 코드"></div><button class="btn outline block" type="submit">교사 콘솔 활성화 →</button></form><button class="btn ghost block" style="margin-top:16px" data-act="logout">다른 계정으로 로그인</button></div>`)}
function csv(rows,filename){let cols=[...new Set(rows.flatMap(o=>Object.keys(o)))];let encode=x=>`"${String(x??'').replace(/"/g,'""')}"`;let data='\ufeff'+cols.map(encode).join(',')+'\r\n'+rows.map(o=>cols.map(c=>encode(o[c])).join(',')).join('\r\n');download(data,filename,'text/csv;charset=utf-8')}
function download(content,filename,type='text/plain;charset=utf-8'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportActivity(type){let teams=Array.from({length:9},(_,i)=>i+1),rows=[];
 if(type==='plans')rows=teams.map(n=>({모둠:n+'모둠',모둠원:SEED[n].members,계획서_원문:SEED[n].plan,교사_사전피드백:SEED[n].feedback}));
 if(type==='notes')rows=teams.flatMap(n=>db.teamData[n].notes.map(x=>({모둠:n+'모둠',작성자:x.author,분류:x.kind,내용:x.text,작성일:x.date})));
 if(type==='spec')rows=teams.map(n=>Object.fromEntries([['모둠',n+'모둠'],['모둠원',SEED[n].members],...QGROUPS.flatMap(g=>g.questions.map(q=>[q[1],db.teamData[n].spec[q[0]]||'']))]));
 if(type==='works')rows=teams.map(n=>({모둠:n+'모둠',제작자:SEED[n].members,...(db.teamData[n].work||{})}));

 if(!rows.length)rows=[{안내:'저장된 자료가 없습니다.'}];csv(rows,`해커톤_${{plans:'계획서와피드백',notes:'모둠의견',spec:'상세기획',works:'제출작품',reflections:'개인소감과자기평가',peers:'동료평가',accounts:'학생등록현황'}[type]}.csv`);notify('CSV 파일을 저장했어요.')}
 function renderTeacher(){const registered=STUDENTS.filter(p=>p.team<=9&&db.accounts[p.id]).length;const works=Array.from({length:9},(_,i)=>i+1).filter(n=>db.teamData[n].work?.title).length;const subs=Object.entries(db.reflections).filter(([id,r])=>!id.startsWith('10:')&&r.status==='submitted').length;layout(`<div class="teacher-console"><div class="page-header"><div><div class="eyebrow">TEACHER CONSOLE · SUPABASE</div><h1>제1회 호연고 해커톤 · 교사 콘솔</h1><p>Supabase 계정으로 로그인했습니다. 기록은 서버에서 불러옵니다.</p></div><button class="btn outline small" data-act="refresh-teacher">⟳ 서버 새로고침</button></div><div class="pill-grid" style="margin-bottom:19px"><div class="stat"><b>${registered}/22</b><span>개인 등록</span></div><div class="stat"><b>${works}/9</b><span>학생 작품</span></div><div class="stat"><b>${subs}/22</b><span>소감문 제출</span></div></div><div class="card pad" style="margin-bottom:18px"><div class="row spread wrap"><div><h2 class="step-title">교사 예시 · 바이브온(VibeON)</h2><p class="note">기획 25문항 및 작품 URL을 교사 권한으로 수정할 수 있어요.</p></div><button class="btn" data-act="teacher-example-edit">10모둠 교사 예시 편집 →</button></div></div><div class="card pad" style="margin-bottom:18px"><h2 class="step-title">학생별 등록 현황</h2><p class="note" style="margin-bottom:14px">개별 등록 코드는 SQL Editor에서만 조회·배부해 주세요. 교사 콘솔에서 비밀번호를 보거나 초기화하지 않습니다.</p><div class="grid3">${STUDENTS.filter(p=>p.team<=9).map(p=>`<div style="background:#f7f8fc;border-radius:11px;padding:13px"><b>${esc(p.name)}</b><div class="note">${p.team}모둠 · ${db.accounts[p.id]?'가입 완료':'가입 전'} · ${db.reflections[p.id]?.status==='submitted'?'소감 제출 완료':'소감 미제출'}</div></div>`).join('')}</div></div><div class="card pad"><h2 class="step-title">활동별 자료 다운로드</h2><p class="note" style="margin-bottom:18px">서버 데이터를 다시 조회하려면 위의 새로고침을 눌러 주세요. 개인 평가 CSV는 교사만 보관해 주세요.</p><div class="teacher-dl">${[['plans','계획서·피드백'],['notes','모둠원 생각'],['spec','웹앱 상세 기획'],['works','작품 제출'],['reflections','소감문·자기평가'],['peers','동료평가'],['accounts','학생 등록 현황'],['backup','전체 JSON 백업']].map(x=>`<button class="btn outline" data-act="export" data-type="${x[0]}">${x[1]} ↓</button>`).join('')}</div></div></div>`)}

function saveReflection(){if(!member||!refOpen)return;let record=db.reflections[member.id]||{answers:{},ratings:{},peers:{},status:'draft'};by('#app').querySelectorAll('[data-ref]').forEach(el=>record.answers[el.dataset.ref]=el.value);by('#app').querySelectorAll('[data-rating]').forEach(el=>record.ratings[el.dataset.rating]=el.value);by('#app').querySelectorAll('[data-peer]').forEach(el=>{record.peers[el.dataset.peer]||={};record.peers[el.dataset.peer][el.dataset.peerfield]=el.value});db.reflections[member.id]=record;queueReflection()}

   }
   if(f.id==='reflect-form'){
     saveReflection();clearTimeout(reflectTimer);db.reflections[member.id].status='submitted';db.reflections[member.id].submittedAt=today();await persistReflection();render();notify('개인 소감·자기평가·동료평가를 서버에 제출했어요.');return;
   }
  }catch(err){showError(err)}finally{delete f.dataset.busy;if(button)button.disabled=false}
 });
document.addEventListener('click',async e=>{let el=e.target.closest('[data-act]');if(!el)return;let a=el.dataset.act;if(a==='scroll-login'||a==='go-login'){view='login';render();return}if(a==='unlock-reflect'){if(!authUser||!member)return;refOpen=true;render();return}if(a==='set-teacher-mode'){teacherMode=el.dataset.mode;render();return}if(a==='refresh-teacher'){try{await loadTeacher();render();notify('서버에서 최신 데이터를 불러왔어요.')}catch(er){showError(er)}return}if(a==='teacher-example-edit'){if(!teacher)return;member={id:'10:교사',team:10,name:'교사'};teamEntered=true;try{await loadTeam(10)}catch(er){showError(er);return}view='work';tab='plan';render();return}if(a==='teacher-home'){if(!teacher)return;member=null;teamEntered=false;try{await loadTeacher()}catch(er){showError(er)}view='teacher';render();return}if(a==='open-gallery'){await readGallery();view='gallery';render();return}if(a==='go-home'){view='landing';render();return}if(a==='select-team'){let n=Number(el.dataset.no);if(!member||n!==member.team){notify('자신이 소속된 모둠을 선택해 주세요.');return}teamChoice=n;render();return}if(a==='goto-teacher'){member=null;teamEntered=false;refOpen=false;view='teachergate';render();return}if(a==='logout'){await askLogout();return}if(a==='set-login'){loginMode=el.dataset.mode;view='login';render();return}if(a==='sample-preview'){let html=db.teamData[10]?.fileHtml;if(!html)return notify('교사 예시 HTML 파일을 먼저 등록해 주세요.');document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="detail-bg"><div class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><h2>교사 예시 웹앱 체험</h2><button class="drawer-close" data-act="close-detail" aria-label="닫기">×</button></div><iframe title="교사 예시 웹앱" sandbox="allow-scripts allow-forms" class="teacher-preview-frame" srcdoc="${esc(html)}"></iframe><p class="note">업로드한 HTML을 이 브라우저에서 미리 보여줘요.</p></div></div>`);return}if(a==='tab'){if(tab==='reflect'){saveReflection();clearTimeout(reflectTimer);await persistReflection()}refOpen=false;tab=el.dataset.tab;if(tab==='gallery')await readGallery();render();return}if(a==='remove-note'){const note=db.teamData[member.team].notes.find(x=>x.uid===el.dataset.id);if(!note||note.author_id!==authUser?.id)return notify('자신이 쓴 의견만 삭제할 수 있어요.');const {error}=await sb.from('hackathon_notes').delete().eq('id',note.uid).eq('author_id',authUser.id);if(error){showError(error);return}await loadTeam(member.team);render();notify('의견이 삭제됐어요.');return}if(a==='guide-shot'){let shot=GUIDE_SHOT_LOOKUP[el.dataset.shot];if(!shot)return;document.body.insertAdjacentHTML('beforeend',`<div class="drawer-bg" id="detail-bg"><div class="drawer guide-shot-modal" role="dialog" aria-modal="true"><div class="drawer-head"><h2>${esc(shot.caption)}</h2><button class="drawer-close" data-act="close-detail" aria-label="닫기">×</button></div><img src="${shot.data}" alt="${esc(shot.caption)}" class="guide-big-image"><div class="guide-inline-action"><button class="btn small outline" data-act="close-detail">닫기</button></div></div></div>`);return}
if(a==='copy-sql-prompt'||a==='download-sql-prompt'){const text=buildSQLPrompt(member.team);if(a==='download-sql-prompt'){download(text,`${member.team}모둠_SQL_생성_프롬프트.txt`)}else await copyGuideText(text,'SQL 프롬프트를 복사했어요. ChatGPT에 붙여넣으세요.');return}

if(a==='copy-prompt'){let text=buildPrompt(member.team);try{await navigator.clipboard.writeText(text)}catch{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}notify('프롬프트를 복사했어요. ChatGPT에 붙여넣어 주세요.');return}if(a==='download-prompt'){download(buildPrompt(member.team),`${member.team}모둠_웹앱_초안프롬프트.txt`);return}if(a==='detail'){let n=Number(el.dataset.no);if(!db.teamData[n].work)return;document.body.insertAdjacentHTML('beforeend',detailOverlay(n));return}if(a==='close-detail'){by('#detail-bg')?.remove();return}if(a==='ref-remove'){db.teamData[member.team].refs.splice(Number(el.dataset.index),1);save();render();return}if(a==='lock-reflect'){saveReflection();clearTimeout(reflectTimer);await persistReflection();refOpen=false;render();return}if(a==='teacher-tab'){teacherTab=el.dataset.mode;render();return}if(a==='export'){exportActivity(el.dataset.type);return}});

document.addEventListener('change',async e=>{if(e.target.id==='reg-student'){let f=by('#teacher-code-field');if(f){let isTeacher=e.target.value.startsWith('10:');f.hidden=!isTeacher;f.querySelector('input').required=isTeacher;}return}if(e.target.id==='teacher-example-file'){if(!member||member.team!==10||!teamEntered)return;let file=e.target.files[0];if(!file)return;if(!/\.html?$/i.test(file.name)){notify('HTML 파일만 등록할 수 있어요.');return}if(file.size>600*1024){notify('HTML 파일은 최대 600KB까지 등록할 수 있어요.');return}let t=await file.text();db.teamData[10].fileHtml=t;db.teamData[10].fileName=file.name;save();let st=by('#example-upload-state');if(st)st.textContent='등록된 파일: '+file.name;notify('교사 예시 HTML 파일을 등록했어요. 작품 정보를 저장해 주세요.');return}if(e.target.id!=='ref-file'||!member)return;let files=[...e.target.files];for(let file of files){if(db.teamData[member.team].refs.length>=3){notify('참고 이미지는 최대 3장까지 업로드할 수 있어요.');break}if(!file.type.startsWith('image/'))continue;try{let img=await new Promise((res,rej)=>{let i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});let max=950,scale=Math.min(1,max/Math.max(img.width,img.height)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(img.width*scale));can.height=Math.max(1,Math.round(img.height*scale));can.getContext('2d').drawImage(img,0,0,can.width,can.height);let data=can.toDataURL('image/jpeg',.72);if(data.length>1200000){notify('이미지가 너무 커서 저장하지 못했어요.');continue}db.teamData[member.team].refs.push({name:file.name.slice(0,45),data});}catch{notify('이미지를 읽지 못했어요.')}}save();render()});
